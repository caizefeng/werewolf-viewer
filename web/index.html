<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the fullscreen player may use the whole screen
         around a notch; the page pads itself with the safe-area insets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0b14" />
    <!-- Added to a phone's home screen it opens without the browser bars -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Werewolf" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Werewolf Viewer</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon-128x128.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700&family=Uncial+Antiqua&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Werewolf Viewer</h1>
      </header>

      <div id="main-layout" data-pane="library">
        <!-- Left sidebar: Library -->
        <aside id="sidebar-left" class="sidebar-panel">
          <div class="sidebar-panel-header">
            <span class="sidebar-panel-title">Library</span>
            <div class="sidebar-panel-actions">
              <button id="lib-filter-btn" class="ctrl-btn" type="button" aria-pressed="false" title="Show bookmarked games only">☆</button>
              <button id="refresh-list" class="ctrl-btn" title="Refresh">↻</button>
            </div>
          </div>
          <ul id="video-list"></ul>
        </aside>

      <div id="player-container">
        <div id="video-wrapper">
          <!-- playsinline: without it an iPhone plays the video in its own
               fullscreen player, where no mask or night overlay can reach.
               Picture-in-picture and casting would show it unmasked too. -->
          <video id="video" preload="metadata" playsinline webkit-playsinline disablepictureinpicture
                 disableremoteplayback x-webkit-airplay="deny"></video>

          <!-- Why the video cannot play here (player.js _showVideoMessage) -->
          <div id="video-message" class="overlay hidden"></div>

          <!-- Night phase overlay -->
          <div id="night-overlay" class="overlay hidden">
            <span class="night-text">Night</span>
          </div>

          <!-- Name mask overlays (positioned dynamically) -->
          <div id="name-masks"></div>

          <!-- Night phase jump panel (left edge slide-out) -->
          <div id="night-jump-buttons"></div>

          <!-- Role reveal panel (right edge slide-out) -->
          <div id="role-panel" class="hidden"></div>

          <!-- Custom controls (above all overlays) -->
          <div id="custom-controls">
            <div id="progress-container">
              <div id="progress-bar">
                <div id="progress-buffered"></div>
                <div id="progress-played"></div>
                <div id="night-markers"></div>
              </div>
            </div>
            <div id="controls-row">
              <button id="play-btn" class="ctrl-btn" title="Play / Pause">▶</button>
              <button id="back-btn" class="ctrl-btn skip-btn" type="button" title="Back 10 s" aria-label="Back 10 seconds">−10</button>
              <button id="fwd-btn" class="ctrl-btn skip-btn" type="button" title="Forward 10 s" aria-label="Forward 10 seconds">+10</button>
              <span id="time-display">0:00 / 0:00</span>
              <button id="mute-btn" class="ctrl-btn" title="Mute">🔊</button>
              <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="1" title="Volume" />
              <button id="toggle-masks" class="ctrl-btn active" title="Shortcut: M">Masks: On</button>
              <button id="mask-mode-btn" class="ctrl-btn" title="Mask coverage">Mask: Full</button>
              <span id="phase-indicator" class="indicator">☀️ Day</span>
              <div id="edit-menu-wrap">
                <button id="edit-menu-btn" class="ctrl-btn" title="Edit night phases and masks" aria-haspopup="true" aria-expanded="false">✎ Edit</button>
                <div id="edit-menu" class="hidden" role="menu">
                  <button id="edit-handles-btn" class="menu-btn touch-only" title="Show the drag handles and × buttons on the masks and night markers (a mouse shows them on hover)">Show edit handles</button>
                  <div class="menu-sep touch-only"></div>
                  <button id="add-phase-btn" class="menu-btn" title="Add a night phase at the current time">+ Night phase</button>
                  <button id="add-mask-btn" class="menu-btn" title="Add a new name mask region">+ Mask</button>
                  <div class="menu-sep"></div>
                  <button id="reset-masks-btn" class="menu-btn" title="Restore the detected mask regions">Reset masks</button>
                  <button id="reset-nights-btn" class="menu-btn" title="Restore the detected night phases">Reset nights</button>
                </div>
              </div>
              <span class="spacer"></span>
              <button id="fullscreen-btn" class="ctrl-btn" title="Fullscreen">⛶</button>
            </div>
          </div>
        </div>

        <div id="info-bar">
          <span class="info-title">
            <button id="bookmark-btn" class="bookmark-btn" type="button" aria-pressed="false" title="Bookmark this game (B)" hidden>☆</button>
            <span id="video-title" class="video-title-label"></span>
          </span>
          <span id="status" class="status"></span>
          <span id="resume-note" class="resume-note" hidden>
            <span id="resume-text"></span>
            <button id="start-over-btn" class="resume-btn" type="button">Start over</button>
          </span>
        </div>

        <!-- Phones: the PHASES and ROLES panels move here, below the player,
             while it is not fullscreen (player.js _placePanels) -->
        <div id="player-dock"></div>
      </div>

        <!-- Phones: one list at a time below the player -->
        <nav id="pane-tabs" aria-label="Lists">
          <button type="button" class="pane-tab active" data-pane="library" aria-pressed="true">Library</button>
          <button type="button" class="pane-tab" data-pane="search" aria-pressed="false">Search<span id="jobs-count" class="pane-tab-count" hidden></span></button>
        </nav>
        <!-- Right sidebar: Search -->
        <aside id="sidebar-right" class="sidebar-panel">
          <div class="sidebar-panel-header">
            <span class="sidebar-panel-title">Search</span>
          </div>
          <div id="search-bar">
            <input id="search-input" type="text" placeholder="Episode keywords, e.g. S23E26" />
            <button id="search-btn" class="ctrl-btn" title="Search">Search</button>
          </div>
          <ul id="search-results"></ul>
        </aside>
      </div><!-- end main-layout -->
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
